<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | AI SmartTime</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>


    <!-- ================= HEADER ================= -->

    <header class="auth-header">

        <a href="index.html" class="brand">

            <div class="brand-title">
                <span>AI</span> SmartTime
            </div>

            <small>ACADEMIC TIMETABLE</small>

        </a>


        <a href="index.html" class="back-home">
            ← Back to Home🏠

        </a>

    </header>



    <!-- ================= REGISTER ================= -->

    <main class="auth-container">

        <div class="auth-card register-card">


            <!-- HEADING -->

            <div class="auth-heading">

                <div class="auth-icon">
                    👤
                </div>

                <h1>Create Account</h1>

                <p>
                    Register for AI SmartTime
                </p>

            </div>



            <!-- FORM -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- ROLE -->

                <div class="form-group">

                    <label for="registerRole">
                        Register As
                    </label>

                    <select
                        id="registerRole"
                        required
                    >

                        <option value="">
                            Select your role
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="faculty">
                            Faculty
                        </option>

                    </select>

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label for="registerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        placeholder="Enter phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                </div>



                <!-- STUDENT ID -->

                <div
                    class="form-group"
                    id="studentIdGroup"
                >

                    <label for="studentId">
                        Student ID / Faculty ID

                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter roll number"
                    >

                </div>



                <!-- FACULTY ID -->

                <div
                    class="form-group"
                    id="facultyIdGroup"
                    style="display:none;"
                >

                    <label for="facultyId">
                        Faculty ID
                    </label>

                    <input
                        type="text"
                        id="facultyId"
                        placeholder="Enter faculty ID"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('registerPassword', this)"
                        >
                            👁
                        </button>

                    </div>

                    <small class="password-help">
                        Minimum 8 characters
                    </small>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the terms and conditions.
                    </span>

                </label>



                <!-- REGISTER -->

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>



                <!-- MESSAGE -->

                <p
                    id="registerMessage"
                    class="message"
                ></p>

            </form>



            <!-- LOGIN -->

            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="auth.js"></script>

</body>

</html>
