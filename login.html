<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AI SmartTime</title>

    <link rel="stylesheet"
          href="auth.css">

</head>


<body>

<!-- ================= LOGIN CONTAINER ================= -->

<div class="auth-container">

    <!-- ================= LOGIN CARD ================= -->

    <div class="auth-card">

        <!-- ================= LOGO ================= -->

        <div class="auth-logo">

            <div>
                <span>AI</span> SmartTime
            </div>

            <small>
                ACADEMIC TIMETABLE
            </small>

        </div>


        <!-- ================= TITLE ================= -->

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to access your dashboard
        </p>


        <!-- ================= LOGIN FORM ================= -->

        <form id="loginForm">

            <!-- ================= ROLE ================= -->

            <div class="input-group">

                <label for="role">
                    Login As
                </label>

                <select id="role" required>

                    <option value="">
                        Select Role
                    </option>

                    <option value="faculty">
                        Faculty
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <!-- ================= EMAIL ================= -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- ================= PASSWORD ================= -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show or hide password">

                        👁

                    </button>

                </div>

            </div>


            <!-- ================= FORGOT PASSWORD ================= -->

            <div class="forgot-container">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <!-- ================= LOGIN BUTTON ================= -->

            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>


        <!-- ================= REGISTER ================= -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


        <!-- ================= BACK HOME ================= -->

        <a href="index.html"
           class="back-home">

            ← Back to Home

        </a>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script src="auth.js"></script>

</body>

</html>
